<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>WORD HUNT</title>
    <meta name="description" content="Find. Learn. Explore. A modern word search adventure game with 10,000+ levels, journey progression, daily puzzles, and relaxing gameplay." />
    <meta property="og:title" content="WORD HUNT" />
    <meta property="og:description" content="Find. Learn. Explore. A modern word search adventure game with 10,000+ levels, journey progression, daily puzzles, and relaxing gameplay." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="author" content="Word Hunt Creator" />
    <meta name="copyright" content="© 2026 Word Hunt Windows. All Rights Reserved." />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png?v=3" />
    <link rel="shortcut icon" href="/favicon.svg?v=3" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png?v=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      @keyframes tileFallDown {
        0% {
          transform: translate3d(0, -80px, 0) rotate(-6deg);
          opacity: 0;
        }
        6% {
          opacity: 1;
        }
        94% {
          opacity: 1;
        }
        100% {
          transform: translate3d(0, 115vh, 0) rotate(10deg);
          opacity: 0;
        }
      }
      @keyframes gentleSway {
        0%, 100% {
          transform: translate3d(0, 0, 0) rotate(-3deg);
        }
        50% {
          transform: translate3d(0, -14px, 0) rotate(3deg);
        }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 overflow-x-hidden select-none font-sans touch-manipulation antialiased" oncontextmenu="return false;" onselectstart="return false;" ondragstart="return false;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
