<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Luxury Gradient -->
    <radialGradient id="bgG" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="60%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>

    <!-- 3D Gold Extrusion Gradient -->
    <linearGradient id="goldG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="85%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <!-- Metallic Rim Gradient -->
    <linearGradient id="rimG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="75%" stop-color="#a16207" />
      <stop offset="100%" stop-color="#713f12" />
    </linearGradient>

    <!-- Cyan Lens Glow -->
    <radialGradient id="lensG" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.7" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#050811" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Base Icon Squircle (Midnight Royal Blue) -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#bgG)" />

  <!-- Outer Golden Game Rim -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="none" stroke="url(#rimG)" stroke-width="10" />

  <!-- Inner Glass Highlight Sheen -->
  <path d="M 24 130 C 24 70 70 24 130 24 L 382 24 C 442 24 488 70 488 130 L 488 170 L 24 310 Z" fill="#ffffff" opacity="0.10" />

  <!-- ================= 3D GOLDEN SEARCH MAGNIFIER (BEHIND 'W') ================= -->
  <g filter="url(#tileShadow)" transform="translate(40, 20)">
    <!-- Handle Shadow & Body -->
    <rect x="330" y="310" width="110" height="34" rx="17" transform="rotate(45, 330, 310)" fill="#713f12" />
    <rect x="330" y="304" width="110" height="34" rx="17" transform="rotate(45, 330, 304)" fill="url(#rimG)" stroke="#fef08a" stroke-width="3" />
    <line x1="375" y1="350" x2="395" y2="370" stroke="#713f12" stroke-width="5" />

    <!-- Magnifier Ring Outer Shadow -->
    <circle cx="270" cy="230" r="115" fill="none" stroke="#581c87" stroke-opacity="0.3" stroke-width="26" />
    <!-- Magnifier Ring Outer Gold -->
    <circle cx="270" cy="225" r="115" fill="none" stroke="url(#rimG)" stroke-width="26" />
    <circle cx="270" cy="225" r="102" fill="none" stroke="#fef08a" stroke-width="5" />

    <!-- Cyan Reflective Glass Lens -->
    <circle cx="270" cy="225" r="99" fill="url(#lensG)" />
    <path d="M 200 200 A 80 80 0 0 1 315 160" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.85" />
    <circle cx="225" cy="180" r="5" fill="#ffffff" />
  </g>

  <!-- ================= GIANT 3D TACTILE GOLDEN 'W' ================= -->
  <!-- 3D Bottom Extrusion Shadow Layer -->
  <g filter="url(#tileShadow)">
    <!-- Extrusion Shadow (Chocolate Amber) -->
    <path d="M 90 145 L 145 385 L 205 385 L 256 240 L 307 385 L 367 385 L 422 145 L 357 145 L 327 305 L 282 170 L 230 170 L 185 305 L 155 145 Z" 
          transform="translate(0, 20)" fill="#451a03" />

    <!-- Main 3D Gold Extrusion Face -->
    <path d="M 90 145 L 145 385 L 205 385 L 256 240 L 307 385 L 367 385 L 422 145 L 357 145 L 327 305 L 282 170 L 230 170 L 185 305 L 155 145 Z" 
          fill="url(#goldG)" stroke="#fef9c3" stroke-width="4" stroke-linejoin="round" />

    <!-- Top Specular Highlight Overlay on 'W' -->
    <path d="M 90 145 L 115 250 L 140 145 Z" fill="#ffffff" opacity="0.5" />
    <path d="M 230 170 L 256 240 L 282 170 Z" fill="#ffffff" opacity="0.4" />
    <path d="M 395 250 L 422 145 L 357 145 Z" fill="#ffffff" opacity="0.5" />
  </g>

  <!-- ================= DAZZLING GOLDEN STAR (TOP-RIGHT) ================= -->
  <g transform="translate(400, 110)">
    <!-- Star Glow -->
    <circle cx="0" cy="0" r="28" fill="#fbbf24" opacity="0.4" />
    <!-- 4-Point Golden Star -->
    <polygon points="0,-42 9,-10 42,0 9,10 0,42 -9,10 -42,0 -9,-10" fill="#fef08a" stroke="#ca8a04" stroke-width="2" />
    <polygon points="0,-30 6,-7 30,0 6,7 0,30 -6,7 -30,0 -6,-7" fill="#ffffff" />
  </g>

  <!-- Small Sparkle (Left) -->
  <g transform="translate(90, 95)">
    <polygon points="0,-22 5,-5 22,0 5,5 0,22 -5,5 -22,0 -5,-5" fill="#fef08a" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
  </g>

  <!-- Small Sparkle (Bottom-Left) -->
  <g transform="translate(105, 415)">
    <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="#fde047" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>
</svg>
